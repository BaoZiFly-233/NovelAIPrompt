name: Release

on:
  push:
    branches: [master, main]
    tags:
      - 'v*'

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

env:
  GRADLE_USER_HOME: ~/.gradle

jobs:
  build-desktop:
    name: Build Desktop (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            task: packageReleaseMsi
            artifact_path: composeApp/build/compose/binaries/main-release/msi
            artifact_ext: '*.msi'
          - os: ubuntu-latest
            task: packageReleaseUberJarForCurrentOS
            artifact_path: composeApp/build/compose/jars
            artifact_ext: '*.jar'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Grant execute permission
        if: runner.os != 'Windows'
        run: chmod +x gradlew

      - name: Build distributable
        run: ./gradlew :composeApp:${{ matrix.task }} --no-daemon

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.os }}
          path: ${{ matrix.artifact_path }}/${{ matrix.artifact_ext }}
          retention-days: 7

  publish-release:
    name: Publish Release
    needs: build-desktop
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist/
          merge-multiple: true

      - name: List artifacts
        run: find dist/ -type f | sort

      # push 到 master 时：更新滚动 nightly pre-release
      - name: Publish nightly pre-release
        if: github.ref_type == 'branch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: nightly
          name: 'Nightly Build'
          prerelease: true
          make_latest: false
          body: |
            自动构建，来自 `master` 分支最新提交。

            **提交：** ${{ github.sha }}
            **时间：** ${{ github.event.head_commit.timestamp }}

            ⚠️ 这是预发布版本，可能包含未完成的功能。
          files: dist/**/*
          fail_on_unmatched_files: false

      # 推送 v* tag 时：创建正式 release（draft 供手动审核后发布）
      - name: Publish tagged release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          prerelease: false
          make_latest: true
          generate_release_notes: true
          files: dist/**/*
          fail_on_unmatched_files: false
